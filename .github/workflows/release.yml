name: Release

# Builds installers for every platform and publishes a GitHub Release when a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test tests/FanKick.Tests -c Release

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Version
        shell: bash
        run: echo "VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//; s/^[^0-9].*/0.0.0/')" >> $GITHUB_ENV
      - name: Publish
        run: dotnet publish src/FanKick -c Release -r win-${{ matrix.arch }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.VERSION }} -o artifacts/win-${{ matrix.arch }}
      # Optional Authenticode signing (shows "harshal.dev" as a verified publisher in UAC and SmartScreen):
      # add WINDOWS_CERT_PFX (base64 of a .pfx) and WINDOWS_CERT_PASSWORD as repository secrets.
      - name: Sign app
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 "artifacts\win-${{ matrix.arch }}\FanKick.exe"
      - name: Installer and zip
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ env.VERSION }} /DArch=${{ matrix.arch }} packaging\windows\FanKick.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, PRIVACY.md "artifacts\win-${{ matrix.arch }}\"
          Compress-Archive -Path "artifacts\win-${{ matrix.arch }}\*" -DestinationPath "artifacts\FanKick-win-${{ matrix.arch }}.zip"
      - name: Sign installer
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 "artifacts\FanKick-Setup-win-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            artifacts/FanKick-Setup-win-${{ matrix.arch }}.exe
            artifacts/FanKick-win-${{ matrix.arch }}.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Version
        run: echo "VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//; s/^[^0-9].*/0.0.0/')" >> $GITHUB_ENV
      - name: Publish both architectures
        run: |
          for a in arm64 x64; do
            dotnet publish src/FanKick -c Release -r osx-$a --self-contained -p:Version=$VERSION -o out/$a
          done
      - name: Universal app and dmg
        run: |
          APP=out/FanKick.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp -R out/arm64 $APP/Contents/Resources/arm64
          cp -R out/x64 $APP/Contents/Resources/x64
          cp packaging/macos/launcher.sh $APP/Contents/MacOS/FanKick
          chmod +x $APP/Contents/MacOS/FanKick
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > $APP/Contents/Info.plist
          cp LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md $APP/Contents/Resources/
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s src/FanKick/Assets/fankick.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) src/FanKick/Assets/fankick.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/FanKick.icns
          codesign --force --deep --sign - $APP
          mkdir -p dmg artifacts
          cp -R $APP dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname FanKick -srcfolder dmg -ov -format UDZO artifacts/FanKick-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/FanKick-macOS-universal.dmg

  linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { rid: linux-x64, deb: amd64 }
          - { rid: linux-arm64, deb: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Version
        run: echo "VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//; s/^[^0-9].*/0.0.0/')" >> $GITHUB_ENV
      - name: Publish
        run: dotnet publish src/FanKick -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$VERSION -o out/fankick
      - name: Package
        run: |
          mkdir -p artifacts
          cp LICENSE THIRD-PARTY-NOTICES.md PRIVACY.md out/fankick/
          tar -czf artifacts/FanKick-${{ matrix.rid }}.tar.gz -C out fankick
          P=pkg
          mkdir -p $P/DEBIAN $P/opt $P/usr/bin $P/usr/share/applications $P/usr/share/icons/hicolor/512x512/apps $P/usr/share/doc/fankick
          cp -R out/fankick $P/opt/fankick
          ln -s /opt/fankick/FanKick $P/usr/bin/fankick
          cp packaging/linux/fankick.desktop $P/usr/share/applications/
          cp src/FanKick/Assets/fankick.png $P/usr/share/icons/hicolor/512x512/apps/fankick.png
          cp LICENSE $P/usr/share/doc/fankick/copyright
          {
            echo "Package: fankick"
            echo "Version: $VERSION"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: ${{ matrix.deb }}"
            echo "Depends: libx11-6, libice6, libsm6, libfontconfig1"
            echo "Maintainer: harshal.dev <94016809+harshaldevvv@users.noreply.github.com>"
            echo "Homepage: https://github.com/harshaldevvv/fankick"
            echo "Description: Fan and thermal control"
            echo " Every fan and sensor the kernel exposes (hwmon, NVIDIA NVML, amdgpu),"
            echo " a curve editor, performance modes, a CPU/GPU stress test and an overlay."
          } > $P/DEBIAN/control
          dpkg-deb --root-owner-group --build $P artifacts/fankick_linux_${{ matrix.deb }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb }}
          path: artifacts/*

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FanKick ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            Download the file for your system below. The README explains what each OS needs: admin rights, the PawnIO driver on Windows, and opening an unsigned app on macOS. SHA256SUMS.txt lists every file's checksum.
